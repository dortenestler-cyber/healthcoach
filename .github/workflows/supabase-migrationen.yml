name: Supabase-Migrationen ausführen

# Führt nach jedem Merge auf main die neuen Dateien aus supabase/migrations in der Datenbank aus.
# Supabase merkt sich, welche schon gelaufen sind; jede Datei läuft nur einmal.
# Pull Requests mit Migrationen merged die Nutzerin selbst. Ihr Merge ist die Freigabe.
#
# Voraussetzung: GitHub-Secret SUPABASE_DB_URL (Settings → Secrets and variables → Actions).
# Wert: in Supabase oben „Connect“ → „Direct“ → Verbindungsart „Session pooler“ → Adresse kopieren
# und [YOUR-PASSWORD] durch das Datenbank-Passwort ersetzen.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      probelauf:
        description: "Nur anzeigen, was ausgeführt würde"
        type: boolean
        default: false

concurrency:
  group: supabase-migrationen
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0 # feste Version wie beim Hochladen der Funktionen
      - name: Migrationen ausführen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROBELAUF: ${{ inputs.probelauf }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Das Secret SUPABASE_DB_URL fehlt. Bitte in GitHub unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
          extra=""
          if [ "$PROBELAUF" = "true" ]; then extra="--dry-run"; fi
          supabase db push --remote="$SUPABASE_DB_URL" --yes $extra
