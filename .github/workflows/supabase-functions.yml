name: Supabase-Funktionen hochladen

# Lädt die Edge Functions nach jedem Merge auf main automatisch zu Supabase hoch.
# Voraussetzung: GitHub-Secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: fkvhuxjsdvssmupewwgl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Funktionen hochladen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt. Bitte in GitHub unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            echo "Lade $name hoch …"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          done
